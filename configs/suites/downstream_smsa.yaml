name: downstream_smsa
description: "IndoNLU SmSA customer review sentiment classification benchmark (balanced 150-sample slice)"
tier: downstream
dataset_version: v1.0.0
task: sentiment
default_classifier: mock-sentiment

slices:
  - {path: "downstream/smsa_test_v1.jsonl", slice_name: downstream_sentiment_smsa}

systems:
  - {system_id: raw-identity,  adapter: raw}
  - {system_id: simple-regex,  adapter: simple_regex}
  - {system_id: sastrawi,      adapter: sastrawi}
  - {system_id: basa-fast,     adapter: basa, params: {lowercase: true, apply_slang: true, apply_typo: false}}
  - {system_id: basa-balanced, adapter: basa, params: {lowercase: true, apply_slang: true, apply_typo: true}}
