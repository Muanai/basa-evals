[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "basa-evals"
version = "0.1.0a0"
description = "Independent evaluation framework, benchmark suite, and dataset pipeline for Indonesian NLP text normalization and preprocessing."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Muanai", email = "muanai@example.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
basa = ["basa"]
sastrawi = ["PySastrawi>=1.2.0"]
tokenizers = [
    "tiktoken>=0.7.0",
    "transformers>=4.40.0",
]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]


[project.scripts]
basa-eval = "basa_evals.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/basa_evals"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/data",
    "/configs",
    "/docs",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true


